version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # TypeScript 7: Next.js 16.2.x build refuses it ("does not provide
      # the compiler API required by Next.js").
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
