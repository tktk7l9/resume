version: 2
updates:
  # Workflow actions are pinned to commits in ci.yml / dependabot-auto-merge.yml;
  # this keeps the pins moving.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"
    ignore:
      # TypeScript 7: its package no longer ships the JavaScript compiler API
      # ("typescript" exports only its version), and
      # src/lib/trust-boundary.test.tsx parses the app source with that API,
      # so typecheck, tests and next build fail. Next.js 16.4 itself accepts
      # TypeScript 7 (its build runs the tsc CLI). Only 7.0.0 and later are
      # ignored; 6.x updates still come through. Remove once that scan no
      # longer imports "typescript".
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
