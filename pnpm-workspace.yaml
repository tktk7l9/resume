allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@next/env@16.2.7'
  - '@next/swc-darwin-arm64@16.2.7'
  - '@next/swc-darwin-x64@16.2.7'
  - '@next/swc-linux-arm64-gnu@16.2.7'
  - '@next/swc-linux-arm64-musl@16.2.7'
  - '@next/swc-linux-x64-gnu@16.2.7'
  - '@next/swc-linux-x64-musl@16.2.7'
  - '@next/swc-win32-arm64-msvc@16.2.7'
  - '@next/swc-win32-x64-msvc@16.2.7'
  - next@16.2.7
  - react-dom@19.2.7
  - react@19.2.7
  - '@next/env@16.2.9'
  - '@next/swc-darwin-arm64@16.2.9'
  - '@next/swc-darwin-x64@16.2.9'
  - '@next/swc-linux-arm64-gnu@16.2.9'
  - '@next/swc-linux-arm64-musl@16.2.9'
  - '@next/swc-linux-x64-gnu@16.2.9'
  - '@next/swc-linux-x64-musl@16.2.9'
  - '@next/swc-win32-arm64-msvc@16.2.9'
  - '@next/swc-win32-x64-msvc@16.2.9'
  - next@16.2.9

overrides:
  'sharp@<0.35.0': '^0.35.0'
  # メジャーごとに範囲を絞ること。フラットに '^5.0.8' を当てると
  # brace-expansion@2 を要求する minimatch@8 まで 5.x に置き換わり、
  # 5.x は default export を持たないので実行時に SyntaxError になる。
  'brace-expansion@>=5.0.0 <5.0.8': '^5.0.8'
  'brace-expansion@>=2.0.0 <2.0.2': '^2.0.2'
  'glob@>=10.2.0 <10.5.0': '^10.5.0'
  'minimatch@>=9.0.0 <9.0.7': '^9.0.7'
  'picomatch@<2.3.2': '^2.3.2'
  'yaml@>=2.0.0 <2.8.3': '^2.8.3'
  'postcss@<8.5.10': '^8.5.10'
